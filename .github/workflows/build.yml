name: Unzip and Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. GIẢI NÉN FILE ZIP
      - name: Unzip Project File
        run: |
          echo "Unzipping archive..."
          unzip -o "*.zip"

      # 2. CÀI ĐẶT MÔI TRƯỜNG JAVA 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. CÀI ĐẶT GRADLE TỰ ĐỘNG (KHÔNG CẦN GRADLEW CÓ SẴN)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. TỰ TẠO WRAPPER VÀ BIÊN DỊCH MOD
      - name: Build Mod with Gradle
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew build --no-daemon

      # 5. XUẤT FILE .JAR ĐỂ TẢI VỀ
      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileOpt-Jar
          path: "**/build/libs/*.jar"
