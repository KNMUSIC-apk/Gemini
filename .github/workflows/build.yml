name: Unzip and Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. TỰ ĐỘNG GIẢI NÉN MỌI FILE .ZIP TRONG REPOSITORY
      - name: Unzip Project File
        run: |
          echo "Finding and unzipping archive..."
          unzip -o "*.zip"
          # Tìm file gradlew trong thư mục gốc hoặc thư mục con và cấp quyền thực thi
          find . -name "gradlew" -exec chmod +x {} +

      # 2. CÀI ĐẶT MÔI TRƯỜNG JAVA 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. CÀI ĐẶT GRADLE
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. CHẠY LỆNH BUILD BIÊN DỊCH MOD
      - name: Build Mod with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon
          else
            # Trường hợp giải nén ra thư mục con, tự di chuyển vào để build
            cd $(find . -maxdepth 2 -name "build.gradle" -exec dirname {} \;)
            chmod +x gradlew
            ./gradlew build --no-daemon
          fi

      # 5. XUẤT FILE .JAR ĐỂ TẢI VỀ
      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileOpt-Jar
          path: "**/build/libs/*.jar"
